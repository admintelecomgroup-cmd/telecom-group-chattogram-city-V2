<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Telecom Group Chattogram City</title>

    <!-- =========================
         PWA Meta
    ========================== -->

    <meta
        name="theme-color"
        content="#0d47a1">

    <meta
        name="mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default">

    <meta
        name="apple-mobile-web-app-title"
        content="Telecom Group">


    <!-- =========================
         PWA Manifest
    ========================== -->

    <link
        rel="manifest"
        href="./manifest.json">


    <!-- =========================
         Icons
    ========================== -->

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="./icons/icon-192.png">

    <link
        rel="apple-touch-icon"
        href="./icons/icon-192.png">


    <!-- =========================
         CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="./style.css">

</head>


<body>


<!-- =====================================================
     Header
===================================================== -->

<header class="header">

    <h1>📱 টেলিকম গ্রুপ</h1>

    <h2>চট্টগ্রাম সিটি</h2>

    <p>সদস্য নিবন্ধন ফর্ম</p>

</header>


<!-- =====================================================
     PWA Install Button
===================================================== -->

<div class="install-box">

    <button
        type="button"
        id="installBtn"
        hidden>

        📲 Install App

    </button>

</div>


<!-- =====================================================
     Member Registration Form
===================================================== -->

<form
    id="memberForm"
    class="container"
    autocomplete="off">


    <!-- =================================================
         Personal Information
    ================================================== -->

    <div class="card">

        <h3>👤 ব্যক্তিগত তথ্য</h3>


        <label for="name">
            পূর্ণ নাম
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="পূর্ণ নাম লিখুন"
            required>


        <label for="mobile">
            মোবাইল নম্বর
        </label>

        <input
            type="tel"
            id="mobile"
            name="mobile"
            maxlength="11"
            minlength="11"
            inputmode="numeric"
            pattern="[0-9]{11}"
            placeholder="01XXXXXXXXX"
            required>


        <label for="whatsapp">
            WhatsApp নম্বর
        </label>

        <input
            type="tel"
            id="whatsapp"
            name="whatsapp"
            maxlength="11"
            minlength="11"
            inputmode="numeric"
            pattern="[0-9]{11}"
            placeholder="01XXXXXXXXX">


        <label for="email">
            ই-মেইল
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com">


        <label for="dob">
            জন্ম তারিখ
        </label>

        <input
            type="date"
            id="dob"
            name="dob">

    </div>


    <!-- =================================================
         Business Information
    ================================================== -->

    <div class="card">

        <h3>🏪 ব্যবসায়িক তথ্য</h3>


        <label for="shop">
            দোকানের নাম
        </label>

        <input
            type="text"
            id="shop"
            name="shop"
            placeholder="দোকানের নাম"
            required>


        <label for="address">
            দোকানের ঠিকানা
        </label>

        <input
            type="text"
            id="address"
            name="address"
            placeholder="সম্পূর্ণ ঠিকানা">


        <label for="map">
            Google Maps Link
        </label>

        <input
            type="url"
            id="map"
            name="map"
            placeholder="https://maps.google.com/...">


        <label for="business">
            ব্যবসার ধরন
        </label>

        <select
            id="business"
            name="business"
            required>

            <option value="">
                -- ব্যবসার ধরন নির্বাচন করুন --
            </option>


            <optgroup label="📱 টেলিকম ও মোবাইল">

                <option>মোবাইল শপ</option>

                <option>মোবাইল সার্ভিসিং</option>

                <option>রিচার্জ পয়েন্ট</option>

                <option>সিম বিক্রয় কেন্দ্র</option>

                <option>বিকাশ এজেন্ট</option>

                <option>নগদ এজেন্ট</option>

                <option>রকেট এজেন্ট</option>

                <option>উপায় এজেন্ট</option>

            </optgroup>


            <optgroup label="🛒 খুচরা ব্যবসা">

                <option>মুদি দোকান</option>

                <option>স্টেশনারি দোকান</option>

                <option>কসমেটিক্স দোকান</option>

                <option>ফার্মেসি</option>

                <option>ইলেকট্রনিক্স দোকান</option>

                <option>কম্পিউটার দোকান</option>

                <option>হার্ডওয়্যার দোকান</option>

                <option>ফার্নিচার দোকান</option>

                <option>কাপড়ের দোকান</option>

                <option>জুতার দোকান</option>

                <option>ঘড়ির দোকান</option>

                <option>গিফট শপ</option>

                <option>লাইব্রেরি</option>

                <option>ফটোকপি ও প্রিন্টিং</option>

            </optgroup>


            <optgroup label="🍽️ খাদ্য ও রেস্টুরেন্ট">

                <option>চায়ের দোকান</option>

                <option>রেস্টুরেন্ট</option>

                <option>বেকারি</option>

                <option>মিষ্টির দোকান</option>

                <option>ফলের দোকান</option>

                <option>সবজির দোকান</option>

            </optgroup>


            <optgroup label="🔧 অন্যান্য">

                <option>অন্যান্য</option>

            </optgroup>

        </select>

    </div>


    <!-- =================================================
         Documents
    ================================================== -->

    <div class="card">

        <h3>📄 ডকুমেন্ট</h3>


        <label for="photo">
            সদস্যের ছবি
        </label>

        <input
            type="file"
            id="photo"
            name="photo"
            accept="image/*"
            required>


        <label for="shopImage">
            দোকানের ছবি
        </label>

        <input
            type="file"
            id="shopImage"
            name="shopImage"
            accept="image/*"
            required>


        <label for="tradeLicense">
            ট্রেড লাইসেন্স
        </label>

        <input
            type="file"
            id="tradeLicense"
            name="tradeLicense"
            accept="image/*,application/pdf"
            required>


        <label for="nid">
            জাতীয় পরিচয়পত্র (NID) নম্বর
        </label>

        <input
            type="text"
            id="nid"
            name="nid"
            maxlength="17"
            minlength="17"
            inputmode="numeric"
            pattern="[0-9]{17}"
            placeholder="১৭ সংখ্যার NID নম্বর"
            required>


        <label for="nidImage">
            NID এর ছবি (ঐচ্ছিক)
        </label>

        <input
            type="file"
            id="nidImage"
            name="nidImage"
            accept="image/*">

    </div>


    <!-- =================================================
         Declaration
    ================================================== -->

    <div class="card">

        <h3>✅ ঘোষণাপত্র</h3>


        <label class="check">

            <input
                type="checkbox"
                id="agree"
                name="agree"
                required>

            আমি নিশ্চিত করছি যে উপরের সকল তথ্য সঠিক।

        </label>


        <button
            type="submit"
            id="submitBtn">

            আবেদন জমা দিন

        </button>

    </div>


</form>


<!-- =====================================================
     Admin Login
===================================================== -->

<div class="top-menu">

    <a href="./login.html">

        🔐 Admin Login

    </a>

</div>


<!-- =====================================================
     JavaScript
===================================================== -->

<script
    type="module"
    src="./script.js">
</script>


<!-- =====================================================
     PWA + Service Worker
===================================================== -->

<script>

let deferredPrompt = null;

const installBtn =
    document.getElementById("installBtn");


/* ==========================================
   Service Worker Registration
========================================== */

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        async () => {

            try {

                const registration =
                    await navigator.serviceWorker.register(
                        "./service-worker.js",
                        {
                            scope: "./"
                        }
                    );

                console.log(
                    "✅ Service Worker Registered:",
                    registration.scope
                );

            } catch (error) {

                console.error(
                    "❌ Service Worker Registration Failed:",
                    error
                );

            }

        }
    );

}


/* ==========================================
   PWA Install Prompt
========================================== */

window.addEventListener(
    "beforeinstallprompt",
    (event) => {

        console.log(
            "✅ beforeinstallprompt fired"
        );

        event.preventDefault();

        deferredPrompt = event;


        if (installBtn) {

            installBtn.hidden = false;

        }

    }
);


/* ==========================================
   Install App Button
========================================== */

if (installBtn) {

    installBtn.addEventListener(
        "click",
        async () => {

            if (!deferredPrompt) {

                alert(
                    "এই মুহূর্তে Install option পাওয়া যাচ্ছে না।"
                );

                return;

            }


            deferredPrompt.prompt();


            const result =
                await deferredPrompt.userChoice;


            console.log(
                "Install result:",
                result.outcome
            );


            deferredPrompt = null;


            installBtn.hidden = true;

        }
    );

}


/* ==========================================
   App Installed
========================================== */

window.addEventListener(
    "appinstalled",
    () => {

        console.log(
            "✅ App Installed Successfully"
        );


        if (installBtn) {

            installBtn.hidden = true;

        }

    }
);

</script>


</body>

</html>
