<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Telecom Group Chattogram City</title>

    <meta
        name="theme-color"
        content="#0d47a1">

    <meta
        name="mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default">

    <meta
        name="apple-mobile-web-app-title"
        content="Telecom Group">

    <link
        rel="manifest"
        href="manifest.json">

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="icons/icon-192.png">

    <link
        rel="apple-touch-icon"
        href="icons/icon-192.png">

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <!-- ========================= -->
    <!-- Login Container -->
    <!-- ========================= -->

    <main class="login-container">

        <section class="login-card">

            <h1>🔐 Admin Login</h1>

            <h3>
                Telecom Group Chattogram City
            </h3>

            <p class="subtitle">
                শুধুমাত্র অনুমোদিত Admin লগইন করতে পারবেন।
            </p>

            <!-- ========================= -->
            <!-- Login Form -->
            <!-- ========================= -->

            <form
                id="loginForm"
                autocomplete="off">

                <div class="input-group">

                    <label for="email">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@email.com"
                        autocomplete="username"
                        aria-label="Admin Email"
                        required>

                </div>

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="********"
                        autocomplete="current-password"
                        aria-label="Password"
                        required>

                </div>

                <button
                    type="submit"
                    id="loginBtn"
                    aria-label="Login">

                    🔑 Login

                </button>

            </form>

            <!-- ========================= -->
            <!-- Footer -->
            <!-- ========================= -->

            <p class="footer">
                শুধুমাত্র অনুমোদিত অ্যাডমিন এই সিস্টেমে
                প্রবেশ করতে পারবেন।
            </p>

            <!-- ========================= -->
            <!-- Navigation -->
            <!-- ========================= -->

            <div class="top-menu">

                <a href="index.html">
                    📝 Member Registration
                </a>

            </div>

        </section>

    </main>

    <!-- ========================= -->
    <!-- JavaScript Disabled -->
    <!-- ========================= -->

    <noscript>

        <p
            style="
                text-align:center;
                color:red;
                font-weight:bold;
                margin:20px;
            ">

            এই ওয়েবসাইট ব্যবহারের জন্য
            JavaScript চালু করুন।

        </p>

    </noscript>

    <!-- ========================= -->
    <!-- Login JavaScript -->
    <!-- ========================= -->

    <script
        type="module"
        src="login.js">
    </script>


    <!-- ========================= -->
    <!-- Service Worker -->
    <!-- একবারই Register হবে -->
    <!-- ========================= -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                async () => {

                    try {

                        const registration =
                            await navigator.serviceWorker.register(
                                "./service-worker.js"
                            );

                        console.log(
                            "✅ Service Worker Registered:",
                            registration.scope
                        );

                    } catch (error) {

                        console.error(
                            "❌ Service Worker Registration Failed:",
                            error
                        );

                    }

                }
            );

        }

    </script>

</body>

</html>
