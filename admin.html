<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Telecom Group Chattogram City</title>

    <meta name="theme-color" content="#0d47a1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<header class="header">

    <h1>📊 Admin Dashboard</h1>

    <h2>Telecom Group Chattogram City</h2>

    <p>Member Management System</p>

</header>


<main class="container">

    <!-- Statistics -->

    <div class="card">

        <h3>📈 সদস্য তথ্য</h3>

        <div class="stats">

            <div class="stat-card">
                <h4>মোট সদস্য</h4>
                <p><b>0</b></p>
            </div>

            <div class="stat-card">
                <h4>Pending</h4>
                <p><b>0</b></p>
            </div>

            <div class="stat-card">
                <h4>Approved</h4>
                <p><b>0</b></p>
            </div>

            <div class="stat-card">
                <h4>Rejected</h4>
                <p><b>0</b></p>
            </div>

        </div>

    </div>


    <!-- Member List -->

    <div class="card">

        <h3>📋 সদস্য তালিকা</h3>

        <input
            type="text"
            id="search"
            placeholder="🔍 নাম বা মোবাইল দিয়ে সার্চ করুন..."
            onkeyup="searchMember()"
        >

        <div class="table-box">

            <table id="memberTable">

                <thead>

                    <tr>
                        <th>Member ID</th>
<th>Member ID</th>
<th>নাম</th>
<th>মোবাইল</th>
<th>WhatsApp</th>
<th>দোকানের নাম</th>
<th>ঠিকানা</th>
<th>স্ট্যাটাস</th>
<th>Action</th>
                    </tr>

                </thead>

                <tbody id="memberTableBody">

                    <tr>
                        <td colspan="8" style="text-align:center;">
                            ⏳ সদস্য তথ্য লোড হচ্ছে...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>


<!-- Navigation -->

<div class="top-menu">

    <a href="./index.html">
        🏠 হোম
    </a>

<button type="button" data-action="logout">
    🚪 Logout
</button>

</div>


<!-- Member Details Modal -->

<div id="memberModal" class="modal">

    <div class="modal-content">

        <span
            class="close"
            onclick="closeModal()"
        >
            &times;
        </span>

        <h2>👤 সদস্যের বিস্তারিত তথ্য</h2>

        <div id="memberDetails"></div>

    </div>

</div>


<!-- PWA Install -->

<div class="install-box">

    <button
        id="installBtn"
        type="button"
        hidden
    >
        📲 Install App
    </button>

</div>


<!-- JavaScript -->

<script type="module" src="./script.js?v=6"></script>


<!-- Service Worker -->

<script>

window.addEventListener("load", async () => {

    if ("serviceWorker" in navigator) {

        try {

            const registration =
                await navigator.serviceWorker.register("./service-worker.js");

            console.log(
                "✅ Service Worker Registered:",
                registration.scope
            );

        } catch (error) {

            console.error(
                "❌ Service Worker Registration Failed:",
                error
            );

        }

    }

});

</script>

</body>

</html>
